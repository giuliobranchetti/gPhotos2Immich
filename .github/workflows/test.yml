name: Test
on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t gphotos2immich-review:ci .
      - name: Verify default review mode
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f review-smoke >/dev/null 2>&1 || true' EXIT
          docker run --name review-smoke -d -p 127.0.0.1:18088:8080 gphotos2immich-review:ci
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:18088/ > /tmp/review.html
          grep -q 'Ricrea i tuoi album' /tmp/review.html
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18088/api/sync)
          test "$status" = 403
      - name: Log in to fork registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish development image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag gphotos2immich-review:ci "$image:dev"
          docker tag gphotos2immich-review:ci "$image:sha-$GITHUB_SHA"
          docker push "$image:dev"
          docker push "$image:sha-$GITHUB_SHA"
